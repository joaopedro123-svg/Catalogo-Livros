services:
  db:
    image: postgres:16-alpine
    container_name: catalogo-livros-db
    environment:
      POSTGRES_DB: catalogo_livros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogo_livros"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: catalogo-livros-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/catalogo_livros
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password

volumes:
  pgdata: