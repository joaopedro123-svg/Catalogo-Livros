spring.application.name=catalogo-livros

# Banco de dados (lê de variáveis de ambiente, com fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/livros_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator (expõe apenas o health por segurança)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized